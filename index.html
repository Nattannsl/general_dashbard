<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho e Controles -->
        <header class="app-header">
            <h1>General Dashboard</h1>
            <button id="toggle-layout" class="btn-toggle">📱 Modo Grade (Retrato)</button>
        </header>

        <!-- Barra de Adição e Filtros -->
        <section class="action-bar">
            <input type="text" id="task-details" placeholder="Detalhes da Tarefa..." class="input-field">
            <select id="task-status" class="select-field">
                <option value="pendencia">📌 Pendência</option>
                <option value="andamento">🔄 Em Andamento</option>
                <option value="concluido">✅ Concluído</option>
            </select>
            <button id="btn-add" class="btn-primary">+ Adicionar</button>
        </section>

        <!-- Kanban / Colunas do Dashboard -->
        <main class="kanban-board" id="kanban-board">
            <div class="kanban-column" data-status="pendencia">
                <div class="column-header">📌 Pendência</div>
                <div class="task-list" id="list-pendencia"></div>
            </div>
            <div class="kanban-column" data-status="andamento">
                <div class="column-header">🔄 Em Andamento</div>
                <div class="task-list" id="list-andamento"></div>
            </div>
            <div class="kanban-column" data-status="concluido">
                <div class="column-header">✅ Concluído</div>
                <div class="task-list" id="list-concluido"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
